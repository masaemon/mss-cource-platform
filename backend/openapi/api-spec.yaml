openapi: 3.0.3
info:
  title: MSS Course Platform BFF API
  description: |
    Backend for Frontend API specification for the MSS Course Platform.
    This API defines all endpoints currently implemented using Supabase,
    prepared for migration to Python FastAPI BFF layer.
  version: 1.0.0
  contact:
    name: MSS Course Platform Team

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://your-app.vercel.app/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication operations
  - name: Courses
    description: Course management operations
  - name: Videos
    description: Video management operations
  - name: Progress
    description: User progress tracking
  - name: Comments
    description: Course comments and instructor replies
  - name: Categories
    description: Course categories
  - name: Users
    description: User management (admin only)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from Supabase authentication

  schemas:
    # Common schemas
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        message:
          type: string

    PaginationMeta:
      type: object
      required:
        - total
        - page
        - limit
      properties:
        total:
          type: integer
          description: Total number of items
        page:
          type: integer
          description: Current page number
        limit:
          type: integer
          description: Items per page
        totalPages:
          type: integer
          description: Total number of pages

    # User/Profile schemas
    UserRole:
      type: string
      enum: [user, instructor, admin]
      description: User role in the system

    Profile:
      type: object
      required:
        - id
        - email
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 50
          nullable: true
          description: User's display name (max 50 characters)
        avatar_url:
          type: string
          format: uri
          nullable: true
        role:
          $ref: '#/components/schemas/UserRole'
        bio:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # Category schemas
    Category:
      type: object
      required:
        - id
        - name_ja
        - name_en
        - slug
      properties:
        id:
          type: string
          format: uuid
        name_ja:
          type: string
          description: Japanese name
        name_en:
          type: string
          description: English name
        slug:
          type: string
          description: URL-friendly identifier
        created_at:
          type: string
          format: date-time

    # Course schemas
    CourseBase:
      type: object
      required:
        - title_ja
        - category_id
      properties:
        title_ja:
          type: string
          maxLength: 100
          description: Course title in Japanese
        title_en:
          type: string
          maxLength: 100
          nullable: true
          description: Course title in English
        description_ja:
          type: string
          maxLength: 1000
          nullable: true
          description: Course description in Japanese
        description_en:
          type: string
          maxLength: 1000
          nullable: true
          description: Course description in English
        category_id:
          type: string
          format: uuid
        thumbnail_url:
          type: string
          format: uri
          nullable: true

    Course:
      allOf:
        - $ref: '#/components/schemas/CourseBase'
        - type: object
          required:
            - id
            - instructor_id
            - is_published
          properties:
            id:
              type: string
              format: uuid
            instructor_id:
              type: string
              format: uuid
            is_published:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    CourseDetail:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          properties:
            categories:
              $ref: '#/components/schemas/Category'
            profiles:
              $ref: '#/components/schemas/Profile'
            videos:
              type: array
              items:
                $ref: '#/components/schemas/Video'

    CourseListItem:
      allOf:
        - type: object
          required:
            - id
            - title_ja
            - created_at
          properties:
            id:
              type: string
              format: uuid
            title_ja:
              type: string
            title_en:
              type: string
              nullable: true
            description_ja:
              type: string
              nullable: true
            description_en:
              type: string
              nullable: true
            thumbnail_url:
              type: string
              format: uri
              nullable: true
            created_at:
              type: string
              format: date-time
            categories:
              type: object
              properties:
                name_ja:
                  type: string
            profiles:
              type: object
              properties:
                email:
                  type: string
            videos:
              type: object
              properties:
                count:
                  type: integer
                  description: Number of videos in the course

    # Video schemas
    VideoBase:
      type: object
      required:
        - youtube_url
        - title_ja
      properties:
        youtube_url:
          type: string
          format: uri
          description: Full YouTube URL
        title_ja:
          type: string
          maxLength: 100
        title_en:
          type: string
          maxLength: 100
          nullable: true
        description_ja:
          type: string
          maxLength: 1000
          nullable: true
        description_en:
          type: string
          maxLength: 1000
          nullable: true

    Video:
      allOf:
        - $ref: '#/components/schemas/VideoBase'
        - type: object
          required:
            - id
            - course_id
            - youtube_video_id
            - order_number
          properties:
            id:
              type: string
              format: uuid
            course_id:
              type: string
              format: uuid
            youtube_video_id:
              type: string
              description: Extracted YouTube video ID
            order_number:
              type: integer
              minimum: 1
              description: Display order within course
            duration:
              type: integer
              nullable: true
              description: Video duration in seconds
            duration_seconds:
              type: integer
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    # Progress schemas
    VideoProgress:
      type: object
      required:
        - id
        - user_id
        - video_id
        - is_completed
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        video_id:
          type: string
          format: uuid
        is_completed:
          type: boolean
        completed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ProgressSummary:
      type: object
      required:
        - totalVideos
        - completedCount
        - percentage
      properties:
        totalVideos:
          type: integer
        completedCount:
          type: integer
        percentage:
          type: integer
          minimum: 0
          maximum: 100

    # Comment schemas
    CommentBase:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 1000

    Comment:
      allOf:
        - $ref: '#/components/schemas/CommentBase'
        - type: object
          required:
            - id
            - course_id
            - user_id
            - is_instructor_reply
          properties:
            id:
              type: string
              format: uuid
            course_id:
              type: string
              format: uuid
            user_id:
              type: string
              format: uuid
            is_instructor_reply:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            profiles:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                avatar_url:
                  type: string
                  nullable: true
                role:
                  $ref: '#/components/schemas/UserRole'

    # Statistics schemas
    UserStats:
      type: object
      required:
        - totalUsers
        - userCount
        - instructorCount
        - adminCount
        - totalCourses
        - publishedCourses
      properties:
        totalUsers:
          type: integer
        userCount:
          type: integer
        instructorCount:
          type: integer
        adminCount:
          type: integer
        totalCourses:
          type: integer
        publishedCourses:
          type: integer

paths:
  # Authentication endpoints
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticate user with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  token:
                    type: string
                    description: JWT authentication token
                  user:
                    $ref: '#/components/schemas/Profile'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (5 attempts per 5 minutes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/signup:
    post:
      tags:
        - Authentication
      summary: User registration
      description: Register a new user account
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - display_name
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                  maxLength: 50
                  minLength: 1
                  description: User's display name (required, 1-50 characters)
                password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: Please check your email to verify your account
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (3 attempts per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Logout current user
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get current authenticated user's profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/profile:
    put:
      tags:
        - Authentication
      summary: Update user profile
      description: Update current user's display name and bio
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 50
                  minLength: 1
                  description: User's display name (1-50 characters)
                bio:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: User's bio (max 500 characters)
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: Send password reset email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset email sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '429':
          description: Rate limit exceeded (3 attempts per hour)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Course endpoints
  /courses:
    get:
      tags:
        - Courses
      summary: List published courses
      description: Get all published courses with optional category filter
      operationId: getCourses
      parameters:
        - name: category
          in: query
          description: Filter by category ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseListItem'

    post:
      tags:
        - Courses
      summary: Create a new course
      description: Create a new course (instructor or admin only)
      operationId: createCourse
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBase'
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Course'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - requires instructor or admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/{id}:
    get:
      tags:
        - Courses
      summary: Get course details
      description: Get detailed information about a course
      operationId: getCourseById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CourseDetail'
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Courses
      summary: Update course
      description: Update course information (owner or admin only)
      operationId: updateCourse
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBase'
      responses:
        '200':
          description: Course updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Courses
      summary: Delete course
      description: Delete a course (owner or admin only)
      operationId: deleteCourse
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/{id}/publish:
    put:
      tags:
        - Courses
      summary: Toggle course publication status
      description: Publish or unpublish a course
      operationId: togglePublish
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_published
              properties:
                is_published:
                  type: boolean
      responses:
        '200':
          description: Publication status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/search:
    get:
      tags:
        - Courses
      summary: Search courses
      description: Search published courses by keyword and category
      operationId: searchCourses
      parameters:
        - name: q
          in: query
          description: Search keyword (searches title and description in both languages)
          schema:
            type: string
        - name: category
          in: query
          description: Filter by category ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseListItem'

  # Video endpoints
  /courses/{courseId}/videos:
    get:
      tags:
        - Videos
      summary: List course videos
      description: Get all videos for a course
      operationId: getCourseVideos
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of videos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Video'

    post:
      tags:
        - Videos
      summary: Add video to course
      description: Add a new video to course (max 10 videos, owner or admin only)
      operationId: addVideo
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoBase'
      responses:
        '201':
          description: Video added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Video'
        '400':
          description: Invalid input or maximum videos reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /videos/{id}:
    put:
      tags:
        - Videos
      summary: Update video
      description: Update video information
      operationId: updateVideo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoBase'
      responses:
        '200':
          description: Video updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Videos
      summary: Delete video
      description: Delete a video and reorder remaining videos
      operationId: deleteVideo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Video deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /videos/{id}/reorder:
    put:
      tags:
        - Videos
      summary: Reorder video
      description: Move video up or down in the course
      operationId: reorderVideo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - direction
              properties:
                direction:
                  type: string
                  enum: [up, down]
      responses:
        '200':
          description: Video reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid direction or already at boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Progress endpoints
  /users/me/progress:
    get:
      tags:
        - Progress
      summary: Get user's all progress
      description: Get all video progress for the current user
      operationId: getAllProgress
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoProgress'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me/courses/{courseId}/progress:
    get:
      tags:
        - Progress
      summary: Get course progress
      description: Get user's progress for a specific course
      operationId: getCourseProgress
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Course progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/VideoProgress'
                  summary:
                    $ref: '#/components/schemas/ProgressSummary'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /videos/{videoId}/progress:
    post:
      tags:
        - Progress
      summary: Update video progress
      description: Mark video as completed or uncompleted
      operationId: updateVideoProgress
      security:
        - bearerAuth: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - is_completed
              properties:
                is_completed:
                  type: boolean
      responses:
        '200':
          description: Progress updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/VideoProgress'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Comment endpoints
  /courses/{courseId}/comments:
    get:
      tags:
        - Comments
      summary: Get course comments
      description: Get all comments for a course
      operationId: getCourseComments
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  count:
                    type: integer
                    description: Total number of comments

    post:
      tags:
        - Comments
      summary: Post a comment
      description: Post a new comment on a course (rate limited - 5 per minute)
      operationId: addComment
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBase'
      responses:
        '201':
          description: Comment posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Comment'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (5 comments per minute)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /courses/{courseId}/comments/instructor-reply:
    post:
      tags:
        - Comments
      summary: Post instructor reply
      description: Post a reply as an instructor (rate limited - 10 per minute)
      operationId: addInstructorReply
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBase'
      responses:
        '201':
          description: Reply posted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Comment'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - requires instructor or admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded (10 replies per minute)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /comments/{id}:
    delete:
      tags:
        - Comments
      summary: Delete comment
      description: Delete a comment (owner or admin only)
      operationId: deleteComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Category endpoints
  /categories:
    get:
      tags:
        - Categories
      summary: List all categories
      description: Get all available course categories
      operationId: getCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  # User management endpoints
  /users:
    get:
      tags:
        - Users
      summary: List users (admin only)
      description: Get paginated list of users with search and filter
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          description: Search by email
          schema:
            type: string
        - name: role
          in: query
          description: Filter by role
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - requires admin role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /users/me:
